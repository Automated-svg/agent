services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    volumes:
      - task-data:/data
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/api/v1/health]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_ORIGIN: http://api:8080
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
volumes:
  task-data:
